[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-review-summarizer"
version = "0.1.0"
description = "Grounded movie review summarizer and independent evaluator"
requires-python = ">=3.10"
dependencies = ["openai>=1.40.0"]

[tool.setuptools.packages.find]
where = ["src"]

